<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>Magic Card</title>

  <!-- CONFIGURACIÓN DE APLICACIÓN -->
  <link rel="manifest" href="./manifest.json">

  <meta name="theme-color" content="#000000">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Magic Card"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css">

</head>


<body>

  <div id="stage">

    <!-- CUERDA -->
    <div id="rope"></div>

    <!-- GANCHO -->
    <div id="hook">🪝</div>


    <!-- CARTA -->
    <div id="card">

      <div class="card-stack">

        <!-- CARTA AZUL -->
        <div class="card-image blue-card"></div>


        <!-- CARTA ROJA -->
        <div
          class="card-image red-card"
          id="redCard">
        </div>


        <!-- FRENTE DE LA CARTA -->
        <div class="card-front">

          <img
            id="selectedCardImage"
            src=""
            alt="Carta seleccionada"
            draggable="false"
          >

        </div>

      </div>

    </div>


    <!-- PLUMÓN -->
    <div id="marker"></div>


    <!-- =================================
         APARTADO SECRETO
         ================================= -->

    <div id="cartasSecretas">

      <div class="panel-cartas">

        <div class="titulo-cartas">
          Selecciona una carta
        </div>

        <div id="listaCartas"></div>

      </div>

    </div>

  </div>


  <!-- JAVASCRIPT -->
  <script src="./script.js"></script>

</body>

</html>
